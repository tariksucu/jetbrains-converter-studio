name: Release

# Publishes a version to JetBrains Marketplace when a tag such as v1.0.1 is pushed. The very first
# version is uploaded by hand on plugins.jetbrains.com; this workflow publishes the later ones.
# Secrets: PUBLISH_TOKEN (a JetBrains Marketplace token) and, to sign the plugin,
# CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the version
        run: |
          version=$(./gradlew -q properties --property version --console=plain | sed -n 's/^version: //p')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but version $version"; exit 1; }

      - name: Test
        run: ./gradlew test

      # The Plugin Verifier against the IDEs in gradle.properties (verifyIdes), as Marketplace does.
      - name: Verify
        run: ./gradlew verifyPlugin

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
