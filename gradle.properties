pluginVersion = 1.0.1

# The IntelliJ Platform the plugin is built against: the oldest one it supports (2026.2, build 262).
platformVersion = 2026.2.5
pluginSinceBuild = 262

# The IDEs the Plugin Verifier checks (type:version, comma-separated).
verifyIdes = IU:2026.2.5,IU:2026.3,PY:2026.3,WS:2026.3

# The IDE bundles the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
